<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="cookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ed8936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c05621;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cookGrad)"/>
  <!-- Chef Hat -->
  <g transform="translate(280, 180)">
    <ellipse cx="120" cy="120" rx="100" ry="40" fill="#f7fafc"/>
    <rect x="40" y="100" width="160" height="80" fill="#f7fafc"/>
    <path d="M 40 180 Q 120 200 200 180" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="2"/>
  </g>
  <!-- Pot -->
  <g transform="translate(320, 350)">
    <ellipse cx="80" cy="10" rx="70" ry="15" fill="#4a5568"/>
    <path d="M 10 10 L 20 80 Q 80 100 140 80 L 150 10" fill="#2d3748" stroke="#1a202c" stroke-width="3"/>
    <ellipse cx="80" cy="80" rx="60" ry="12" fill="#1a202c"/>
    <!-- Handle -->
    <path d="M 10 40 Q -10 40 -10 60" fill="none" stroke="#4a5568" stroke-width="8" stroke-linecap="round"/>
    <path d="M 150 40 Q 170 40 170 60" fill="none" stroke="#4a5568" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
